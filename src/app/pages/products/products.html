<section class="products-page">

  <!-- =====================================================
       HERO SECTION
       ===================================================== -->

  <header class="hero">

    <div class="eyebrow">
      {{ eyebrow() }}
    </div>

    <h1>
      {{ heading() }}
    </h1>

    <p>
      {{ intro() }}
    </p>

  </header>


  <!-- =====================================================
       PRODUCTS GRID
       ===================================================== -->

  <main class="grid">

    @for (product of products(); track product.title) {

    <article class="card">

      <!-- Product Number -->
      <span class="num">
        {{ product.num }}
      </span>


      <!-- Product Icon -->
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">

        @switch (product.icon) {

        @case ('code') {
        <path d="M4 17V7a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v10M4 17h16M4 17l-2 4h20l-2-4" />
        }

        @case ('network') {
        <circle cx="12" cy="12" r="3" />
        <circle cx="4" cy="6" r="1.6" />
        <circle cx="20" cy="6" r="1.6" />
        <circle cx="4" cy="18" r="1.6" />
        <circle cx="20" cy="18" r="1.6" />

        <path d="M6 7l4.5 3.5M18 7l-4.5 3.5M6 17l4.5-3.5M18 17l-4.5-3.5" />
        }

        @case ('chip') {
        <rect x="6" y="6" width="12" height="12" rx="1" />

        <path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4" />
        }

        @case ('chart') {
        <path d="M3 17l6-10 4 6 3-4 5 8" />
        <path d="M3 20h18" />
        }

        @case ('bars') {
        <path d="M4 19V9M10 19V5M16 19v-7M22 19H2" />
        }

        @case ('clock') {
        <circle cx="12" cy="12" r="9" />
        <path d="M12 7v5l3 3" />
        }

        @case ('shield') {
        <path d="M12 3l7 3v6c0 5-3.5 7.5-7 9-3.5-1.5-7-4-7-9V6l7-3z" />
        }

        @case ('cloud') {
        <path d="M7 18a4.5 4.5 0 0 1-.6-8.96A5.5 5.5 0 0 1 17 8.5 4 4 0 0 1 17 18H7z" />
        }

        @case ('grid') {
        <rect x="3" y="3" width="18" height="18" rx="1" />

        <path d="M8 3v18M16 3v18M3 8h18M3 16h18" />
        }

        @case ('robot') {
        <rect x="7" y="9" width="10" height="9" rx="1" />

        <path d="M9 9V6a3 3 0 0 1 6 0v3M9 13h.01M15 13h.01" />
        }

        @case ('blocks') {
        <rect x="3" y="4" width="6" height="6" rx="1" />

        <rect x="15" y="4" width="6" height="6" rx="1" />

        <rect x="9" y="14" width="6" height="6" rx="1" />

        <path d="M6 10v2a2 2 0 0 0 2 2h1M18 10v2a2 2 0 0 1-2 2h-1" />
        }

        }

      </svg>


      <!-- Product Category -->
      <div class="tag">
        {{ product.tag }}
      </div>


      <!-- Product Title -->
      <h2>
        {{ product.title }}
      </h2>


      <!-- Product Description -->
      <p>
        {{ product.description }}
      </p>

    </article>

    }

  </main>

</section>
